<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- fontawesome -->
    <script
      src="https://kit.fontawesome.com/04579c0976.js"
      crossorigin="anonymous"
    ></script>
    <!-- css & script -->
    <link rel="stylesheet" href="./styles/common.css" />
    <link rel="stylesheet" href="./styles/contents.css" />
    <link rel="stylesheet" href="./styles/responsive.css" />
    <script defer src="./logon.js"></script>
    <title>Logon | Metaphor</title>
  </head>
  <body>
    <section class="log_onwrapper">
      <a href="./index.html">
        <div class="logo2">
          <img src="./imgs/logo.svg" alt="logo" />
        </div>
      </a>
      <form class="logon_contents">
        <ul>
          <li>
            <h3>아이디</h3>
            <div class="borderouter">
              <input class="border" id="id" type="text" placeholder="아이디" />
              <div id="error_id" class="error"></div>
            </div>
          </li>
          <li>
            <h3>비밀번호</h3>
            <div class="eyeone">
              <input
                class="border"
                id="passwords"
                type="password"
                placeholder="비밀번호"
              />
              <i class="fas fa-eye eye11"></i>
              <div id="error_passwords" class="error"></div>
            </div>
          </li>
          <li>
            <h3>비밀번호 확인</h3>
            <div class="eyetwo">
              <input
                class="border"
                id="passwordok"
                type="password"
                placeholder="비밀번호"
              />
              <i class="fas fa-eye"></i>
              <div id="error_passwordok" class="error"></div>
            </div>
          </li>
          <li>
            <h3>이름</h3>
            <div class="borderouter">
              <input
                class="border"
                id="writer"
                type="text"
                placeholder="이름"
              />
              <div id="error_writer" class="error"></div>
            </div>
          </li>
          <li>
            <h3>생년월일</h3>
            <div class="borderouter">
              <input
                class="border"
                id="birthday"
                type="text"
                placeholder="생년월일 8자리 입력"
              />
              <div id="error_birthday" class="error"></div>
            </div>
          </li>
          <li class="fourboxouter">
            <section class="fourbox">
              <button id="man">남자</button>
              <button id="woman">여자</button>
              <button id="localman">내국인</button>
              <button id="foreigner">외국인</button>
            </section>
            <div id="error_fourbox" class="error"></div>
          </li>
          <li class="number">
            <h3>휴대전화번호</h3>
            <div class="borderouter">
              <input
                class="border"
                id="phonenum"
                type="text"
                placeholder="전화번호"
              /><i class="fas fa-mobile-screen-button"></i>
              <div id="error_phonenum" class="error"></div>
            </div>
          </li>

          <a class="signup" href="./index.html">
            <div>회원가입</div>
          </a>
        </ul>
      </form>
    </section>
    <div class="gray_bg"></div>
  </body>
</html>
