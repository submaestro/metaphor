<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <!-- fontawesome -->
    <script

    <link rel="stylesheet" href="./styles/common.css" />

    <script defer src="./common.js"></script>
    <script defer src="./mypage.js"></script>
    <title>Mypage | Metaphor</title>

  <body>
    <!-- header -->
    <header id="header">
      <div class="header_wrap">
        <div class="header_left">
          <h1 class="header_logo">
            <a href="./index.html">
              <img src="./imgs/logo.svg" alt="logo" />
              <img src="./imgs/logo_w.svg" alt="logo_white" />

          </h1>
          <ul id="gnb">
            <li><a href="./artist.html">ARTIST</a></li>

            <li><a href="./magazine.html">MAGAZINE</a></li>
          </ul>
        </div>
        <!-- full -->
        <div class="header_right">
          <!--search-->
          <form
            id="search_form_pc"
            name="search_bar_pc"
            method="#"
            action="post"
            class="search_bar"
          >
            <button class="search_btn">
              <img src="./imgs/h_search.svg" alt="search" />
            </button>
            <input class="search_txt" type="text" placeholder="아티스트 검색" />
          </form>
          <!--signup-->
          <a class="signup_btn" href="./login.html">
            <span>sign up</span>
          </a>
          <!--mypage-->
          <a class="mypage_btn" href="./mypage.html">
            <img src="./imgs/h_signup_m.svg" alt="search" />
            <span id="hiUser"><b id="hiUsername"></b>님 안녕하세요</span>
          </a>
        </div>

        <!-- mobile -->
        <div class="header_right_m">
          <a class="signup_btn_m" href="./login.html">
            <span>sign up</span>
          </a>
          <!--search-->
          <button class="search_btn_m">
            <img src="./imgs/h_search_m.svg" alt="search" />
          </button>
          <!--mypage-->
          <a class="mypage_btn_m" href="./mypage.html">
            <img src="./imgs/h_signup_m.svg" alt="search" />
          </a>
          <!--trigger-->
          <div class="trigger_bar_m">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
        <div id="header_menu_m">
          <div id="header_menuBox"></div>
        </div>
        <div id="search_area_m">
          <form
            id="search_form_mb"
            name="search_bar_mb"
            method="#"
            action="post"
            class="search_bar"
          >
            <button class="search_btn">
              <img src="./imgs/h_search.svg" alt="search" />
            </button>
            <input class="search_txt" type="text" placeholder="아티스트 검색" />
          </form>
          <button class="search_close_m">
            <img src="./imgs/h_search__back_m.svg" alt="SearchCloseBtn" />
          </button>
        </div>
      </div>
    </header>

    <!-- mypage -->

    <main class="mypage">
      <section class="info">
        <h1 class="myinfo">내정보</h1>
        <ul class="info_list">
          <li>
            <b>아이디</b> <br />
            <div id="mpID"></div>
          </li>
          <li>
            <b>닉네임</b> <br />
            <span
              >메타포<button><b>변경</b></button></span

          </li>
          <li>
            <b>이름</b> <br />
            <span>
              <div id="mpName">정휘찬</div>
              <button><b>변경</b></button></span

          </li>
          <li>
            <b>비밀번호</b> <br />
            <span
              >비밀번호설정<button><b>변경</b></button></span
            >
          </li>
          <li>
            <b>국가</b> <br />

          </li>
          <li>
            <b>전화번호 </b><br />

          <li>

              >보기

            </span>

        <div class="logout"><a href="./index.html">로그아웃</a></div>
      </section>

    <div class="gray_bg"></div>
    <!-- footer -->
    <footer class="footer">
      <div class="wrapper">
        <div class="up_btn">
          <a href="#header">
            <div class="up_arrow_container">
              <i class="fas fa-chevron-up"></i>

        <div class="footer_wrap">
          <div class="footer_left">

              <a href="./artist.html">ARTIST</a>
              <div></div>
              <a href="./chart.html">MUSIC</a>

            <p>Copyright Ⓒ 2025 Metaphor. All rights reserved.</p>
          </div>
          <div class="footer_logo">
